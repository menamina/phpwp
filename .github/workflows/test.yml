name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sqlite3, mbstring, xml, curl

      - name: Install dependencies
        working-directory: app/public/wp-content/plugins/react-plugin
        run: composer install

      - name: Install Playwright browsers
        working-directory: app/public/wp-content/plugins/react-plugin
        run: vendor/bin/playwright-install chromium

      - name: Start built-in PHP server for WordPress
        working-directory: app/public/wp-content/plugins/react-plugin
        run: |
          nohup php -S localhost:44969 -t tests/_wordpress > server.log 2>&1 &
          sleep 5

      - name: Run Codeception tests
        working-directory: app/public/wp-content/plugins/react-plugin
        run: vendor/bin/codecept run

      - name: Set up Playwright authentication
        working-directory: app/public/wp-content/plugins/react-plugin
        env:
          WP_TEST_URL: http://localhost:44969
          WP_TEST_USER: ${{ secrets.WP_TEST_USER }}
          WP_TEST_PASSWORD: ${{ secrets.WP_TEST_PASSWORD }}
        run: php tests/Playwright/authScript.php

      - name: Run Playwright tests
        working-directory: app/public/wp-content/plugins/react-plugin
        env:
          WP_TEST_URL: http://localhost:44969
        run: vendor/bin/phpunit tests/Playwright/
