# EndToEnd suite configuration
#
# Run end-to-end tests.

actor: EndToEndTester
bootstrap: _bootstrap.php
modules:
    enabled:
        - lucatume\WPBrowser\Module\WPWebDriver
        - lucatume\WPBrowser\Module\WPDb
        - lucatume\WPBrowser\Module\WPFilesystem
        - lucatume\WPBrowser\Module\WPLoader
    config:
        lucatume\WPBrowser\Module\WPWebDriver:
            url: '%env(WORDPRESS_URL)%'
            adminUsername: '%env(WORDPRESS_ADMIN_USER)%'
            adminPassword: '%env(WORDPRESS_ADMIN_PASSWORD)%'
            adminPath: '%env(WORDPRESS_ADMIN_PATH)%'
            browser: chrome
            host: '%env(CHROMEDRIVER_HOST)%'
            port: '%env(CHROMEDRIVER_PORT)%'
            path: '/'
            window_size: 1200x1000
            capabilities:
              "goog:chromeOptions":
                args:
                  - "--headless"
                  - "--disable-gpu"
                  - "--disable-dev-shm-usage"
                  - "--proxy-server='direct://'"
                  - "--proxy-bypass-list=*"
                  - "--no-sandbox"
        lucatume\WPBrowser\Module\WPDb:
            dbUrl: '%env(WORDPRESS_DB_URL)%'
            dump: 'tests/Support/Data/dump.sql'
            populate: true
            cleanup: true
            reconnect: false
            url: '%env(WORDPRESS_URL)%'
            urlReplacement: false
            tablePrefix: '%env(WORDPRESS_TABLE_PREFIX)%'
        lucatume\WPBrowser\Module\WPFilesystem:
            wpRootFolder: '%env(WORDPRESS_ROOT_DIR)%'
        lucatume\WPBrowser\Module\WPLoader:
            loadOnly: true
            wpRootFolder: '%env(WORDPRESS_ROOT_DIR)%'
            dbUrl: '%env(WORDPRESS_DB_URL)%'
            domain: '%env(WORDPRESS_DOMAIN)%'
 