# Integration suite configuration
#
# Run integration and "WordPress unit" tests.

actor: IntegrationTester
bootstrap: _bootstrap.php
modules:
    enabled:
        - lucatume\WPBrowser\Module\WPLoader
    config:
        lucatume\WPBrowser\Module\WPLoader:
           wpRootFolder: "%env(WORDPRESS_ROOT_DIR)%"
           dbUrl: '%env(WORDPRESS_DB_URL)%'
           wpDebug: true
           tablePrefix: '%env(TEST_TABLE_PREFIX)%'
           domain: '%env(WORDPRESS_DOMAIN)%'
           adminEmail: 'admin@%env(WORDPRESS_DOMAIN)%'
           title: 'Integration Tests'
           plugins: ['./react-plugin.php']
           theme: ''